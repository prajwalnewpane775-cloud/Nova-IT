<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — NovaIT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: #060b14;
    }
    .error-code {
      font-size: 120px;
      font-weight: 900;
      background: linear-gradient(135deg, #5477ff, #7d59ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .error-msg {
      color: #9ca3b0;
      font-size: 18px;
      margin: 16px 0 30px;
    }
    .error-home {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 12px;
      background: linear-gradient(135deg, #5477ff, #7d59ff);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: .3s;
    }
    .error-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(84,119,255,.4);
    }
  </style>
</head>
<body>
  <div>
    <div class="error-code">404</div>
    <p class="error-msg">Oops! The page you're looking for doesn't exist.</p>
    <a href="/" class="error-home">← Back to Home</a>
  </div>
</body>
</html>
